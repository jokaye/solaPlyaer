<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sola Player · 方案1 精修（蓝/绿天气）</title>
<style>
  :root{--ease:cubic-bezier(0.22,1,0.36,1);--glass:rgba(255,255,255,.18);--hair:rgba(255,255,255,.28);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"PingFang SC",sans-serif;background:#0b0c10;color:#fff;display:grid;place-items:center;-webkit-font-smoothing:antialiased;}
  .phone{position:relative;width:340px;height:720px;border-radius:54px;background:#000;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.06);}
  .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#101216;}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#000;border-radius:20px;z-index:60;}
  .statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:20px 26px 0;font-size:13px;font-weight:600;z-index:55;}
  .bg{position:absolute;inset:0;}
  .p-top{position:absolute;top:60px;left:24px;right:24px;z-index:20;display:flex;justify-content:space-between;align-items:center;}
  .p-top svg{width:24px;height:24px;stroke:#fff;stroke-width:1.7;fill:none;}
  .vbadge{position:absolute;top:60px;left:0;right:0;text-align:center;font-size:12px;font-weight:600;letter-spacing:1px;opacity:.9;z-index:21;text-shadow:0 1px 6px rgba(0,0,0,.15);}
  .p-time{font-weight:200;letter-spacing:-1px;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.08);}
  .p-total{opacity:.75;font-weight:300;font-size:15px;margin-top:6px;}
  .p-title{font-weight:500;font-size:19px;margin-top:16px;}
  .p-artist{opacity:.75;font-size:13px;margin-top:3px;display:flex;align-items:center;gap:6px;}
  .p-tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--glass);backdrop-filter:blur(8px);}

  .wave-labels{display:flex;justify-content:space-between;font-size:11px;opacity:.65;padding:0 4px 8px;}
  .wave{position:relative;display:flex;align-items:center;gap:2px;cursor:grab;user-select:none;touch-action:none;}
  .bar{flex:1;border-radius:3px;background:rgba(255,255,255,.32);}
  .bar.played{background:#fff;}
  .pill{position:absolute;top:-30px;transform:translateX(-50%);background:#fff;color:#111;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.28);pointer-events:none;}
  .pill::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:#fff;}
  .marker{position:absolute;top:-2px;width:2px;background:#ffd15c;pointer-events:none;}
  .marker .flag{position:absolute;top:-2px;left:3px;font-size:10px;font-weight:600;color:#111;background:#ffd15c;padding:2px 5px;border-radius:7px;white-space:nowrap;}
  .knob{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none;border:3px solid rgba(255,255,255,.6);}

  .tp{cursor:pointer;opacity:.95;display:grid;place-items:center;}
  .tp svg{stroke:#fff;fill:#fff;}
  .play{border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--hair);display:grid;place-items:center;cursor:pointer;}
  .act{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 13px;border-radius:22px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--hair);cursor:pointer;}
  .act svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.7;}
  .zone{position:absolute;left:0;right:0;z-index:15;}
  .dock{display:flex;align-items:center;justify-content:space-around;gap:6px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);border:1px solid var(--hair);border-radius:26px;padding:9px 14px;}
  .foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#7b8290;}
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span>􀙇 􀋨 􀛨</span></div>
    <div class="bg" id="bg"></div>
    <div class="p-top"><div class="ic"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div><div class="ic"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="#fff" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="#fff" stroke="none"/></svg></div></div>
    <div class="vbadge" id="vbadge"></div>
    <div id="root"></div>
  </div></div>
  <div class="foot" id="foot"></div>

<script>
  const DUR=228,N=60;
  const amps=Array.from({length:N},(_,i)=>{const env=Math.sin(i/N*Math.PI);const d=.35+.65*Math.abs(Math.sin(i*.9)*Math.cos(i*.37));return Math.max(.14,Math.min(1,env*d+(Math.random()*.1-.02)));});
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  const params=new URLSearchParams(location.search);
  const V=parseInt(params.get('v')||'1');
  let progress=.30, playing=false;
  const markers=[.14,.42,.72];

  // 6 blue/green weather palettes + tag
  const PAL={
    1:{bg:"linear-gradient(180deg,#4aa8ff 0%,#8fc9ff 48%,#dbeeff 100%)",tag:"晴空"},
    2:{bg:"linear-gradient(180deg,#17b3c6 0%,#7fe0e6 52%,#e0f7f7 100%)",tag:"湖水"},
    3:{bg:"linear-gradient(180deg,#2ec98a 0%,#8fe6bd 52%,#e2f8ec 100%)",tag:"薄荷"},
    4:{bg:"linear-gradient(180deg,#0f8fd6 0%,#3fd0c0 55%,#c4f2e8 100%)",tag:"海洋"},
    5:{bg:"linear-gradient(180deg,#5ab0ff 0%,#63d6c2 58%,#cdf6e4 100%)",tag:"天青"},
    6:{bg:"linear-gradient(180deg,#00bcd4 0%,#5fe0b8 54%,#daf7ef 100%)",tag:"水绿"},
  };
  const NAMES={1:"精修 1 · 晴空蓝 · 居中微控件",2:"精修 2 · 湖水青 · 内联文字控件",3:"精修 3 · 薄荷绿 · 玻璃条波形",4:"精修 4 · 海洋蓝绿 · 圆柄易拖",5:"精修 5 · 天青 · 底部微坞",6:"精修 6 · 水绿 · 粗轨极简"};
  const DESC={1:"上半天气渐变留白，波形下移，播放键缩到 44pt 居中",2:"控件收成无底纹小图标，播放键 36pt，波形更靠下",3:"波形放进下方磨砂玻璃条，控件收进小坞",4:"波形带圆形拖拽手柄，控件极小，最易拖动",5:"所有控件并进底部小胶囊坞，波形独占下半",6:"加厚触控轨+圆柄，仅 3 个小图标，最省心"};

  const iPrev='<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 6v12M20 6l-9 6 9 6z"/></svg>';
  const iNext='<svg viewBox="0 0 24 24" fill="#fff"><path d="M17 6v12M4 6l9 6-9 6z"/></svg>';
  const iPlay='<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
  const iHeartL='<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6"><path d="M12 21s-7-4.5-9.5-9C1 8 2.5 4 6 4c2 0 3.2 1.3 4 2.5C10.8 5.3 12 4 14 4c3.5 0 5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg>';
  const iMarkL='<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
  const iHeart='<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9C1 8 2.5 4 6 4c2 0 3.2 1.3 4 2.5C10.8 5.3 12 4 14 4c3.5 0 5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg>';
  const iMark='<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

  const topBlock=`<div style="position:absolute;top:120px;left:26px;right:26px">
      <div class="p-time" style="font-size:76px">${fmt(progress*DUR)}</div>
      <div class="p-total">/ ${fmt(DUR)}</div>
      <div class="p-title">城市清晨 · 环境采集</div>
      <div class="p-artist">Field Recording <span class="p-tag" id="tag">晴空</span></div>
    </div>`;
  function waveEl(h,handle){return `<div class="wave-labels"><span>0:00</span><span>${fmt(DUR/2)}</span><span>${fmt(DUR)}</span></div>
    <div class="wave" id="wave" style="height:${h}px"><div class="pill" id="pill">0:00</div>${handle?'<div class="knob" id="knob"></div>':''}</div>`;}
  function actions(){return `<div style="display:flex;justify-content:center"><div class="act">${iMark}标记此刻</div></div>`;}
  function tpMini(play,btn,gap){return `<div style="display:flex;align-items:center;justify-content:center;gap:${gap}px">
     <div class="tp" style="width:${btn}px;height:${btn}px">${iPrev}</div>
     <div class="play" id="play" style="width:${play}px;height:${play}px"><span style="width:${play*.38}px;height:${play*.38}px;display:grid">${iPlay}</span></div>
     <div class="tp" style="width:${btn}px;height:${btn}px">${iNext}</div></div>`;}

  function layout(v){
    switch(v){
      case 1: return `${topBlock}
        <div class="zone" style="bottom:150px;padding:0 20px">${waveEl(80,false)}</div>
        <div class="zone" style="bottom:100px;padding:0 22px">${actions()}</div>
        <div class="zone" style="bottom:48px">${tpMini(42,19,38)}</div>`;
      case 2: return `${topBlock}
        <div class="zone" style="bottom:146px;padding:0 20px">${waveEl(84,false)}</div>
        <div class="zone" style="bottom:96px;padding:0 22px">${actions()}</div>
        <div class="zone" style="bottom:50px"><div style="display:flex;align-items:center;justify-content:center;gap:40px">
          <div class="tp" style="width:20px;height:20px">${iPrev}</div>
          <div class="tp" id="play" style="width:28px;height:28px">${iPlay}</div>
          <div class="tp" style="width:20px;height:20px">${iNext}</div></div></div>`;
      case 3: return `${topBlock}
        <div class="zone" style="bottom:120px;left:16px;right:16px">
          <div style="background:rgba(255,255,255,.14);backdrop-filter:blur(20px);border:1px solid var(--hair);border-radius:22px;padding:14px 14px 12px">${waveEl(74,false)}</div>
        </div>
        <div class="zone" style="bottom:52px;padding:0 20px"><div class="dock">
          <div class="tp" style="width:22px;height:22px">${iPrev}</div>
          <div class="play" id="play" style="width:40px;height:40px"><span style="width:15px;height:15px;display:grid">${iPlay}</span></div>
          <div class="tp" style="width:22px;height:22px">${iNext}</div>${iMarkL}</div></div>`;
      case 4: return `${topBlock}
        <div class="zone" style="bottom:150px;padding:0 20px">${waveEl(88,true)}</div>
        <div class="zone" style="bottom:98px;padding:0 22px">${actions()}</div>
        <div class="zone" style="bottom:48px">${tpMini(38,18,42)}</div>`;
      case 5: return `${topBlock}
        <div class="zone" style="bottom:110px;padding:0 20px">${waveEl(96,false)}</div>
        <div class="zone" style="bottom:50px;padding:0 20px"><div class="dock">
          <div class="tp" style="width:22px;height:22px">${iPrev}</div>
          <div class="play" id="play" style="width:38px;height:38px"><span style="width:14px;height:14px;display:grid">${iPlay}</span></div>
          <div class="tp" style="width:22px;height:22px">${iNext}</div>${iMarkL}</div></div>`;
      case 6: return `${topBlock}
        <div class="zone" style="bottom:118px;padding:0 16px">
          <div class="wave-labels"><span>0:00</span><span>${fmt(DUR/2)}</span><span>${fmt(DUR)}</span></div>
          <div style="background:rgba(255,255,255,.12);border:1px solid var(--hair);border-radius:20px;padding:13px 14px">
            <div class="wave" id="wave" style="height:80px"><div class="pill" id="pill">0:00</div><div class="knob" id="knob"></div></div>
          </div>
        </div>
        <div class="zone" style="bottom:52px"><div style="display:flex;align-items:center;justify-content:center;gap:44px">
          <div class="tp" style="width:20px;height:20px">${iPrev}</div>
          <div class="tp" id="play" style="width:26px;height:26px">${iPlay}</div>
          <div class="tp" style="width:20px;height:20px">${iNext}</div></div></div>`;
    }
  }

  document.getElementById('root').innerHTML=layout(V);
  document.getElementById('bg').style.background=PAL[V].bg;
  document.getElementById('tag').textContent=PAL[V].tag;
  document.getElementById('vbadge').textContent=NAMES[V];
  document.getElementById('foot').textContent=NAMES[V]+' — '+DESC[V];

  const wave=document.getElementById('wave');
  const bars=[];
  const wh=parseInt(wave.style.height);
  amps.forEach(a=>{const b=document.createElement('div');b.className='bar';b.style.height=(wh*.14+a*wh*.8)+'px';wave.appendChild(b);bars.push(b);});
  const pill=document.getElementById('pill'),knob=document.getElementById('knob');
  function renderMarkers(){document.querySelectorAll('.marker').forEach(e=>e.remove());const w=wave.clientWidth,h=wave.clientHeight;markers.forEach(f=>{const m=document.createElement('div');m.className='marker';m.style.left=(f*w)+'px';m.style.height=(h+6)+'px';m.innerHTML=`<div class="flag">${fmt(f*DUR)}</div>`;wave.appendChild(m);});}
  function render(){const hi=Math.round(progress*(N-1));bars.forEach((b,i)=>b.classList.toggle('played',i<=hi));const w=wave.clientWidth;pill.style.left=(progress*w)+'px';pill.textContent=fmt(progress*DUR);if(knob)knob.style.left=(progress*w)+'px';const t=document.querySelector('.p-time');if(t)t.textContent=fmt(progress*DUR);}
  let drag=false,last=-1;
  function setX(x){const r=wave.getBoundingClientRect();progress=Math.max(0,Math.min(1,(x-r.left)/r.width));render();const hi=Math.round(progress*(N-1));if(hi!==last&&last!==-1&&navigator.vibrate)navigator.vibrate(6);last=hi;}
  wave.addEventListener('pointerdown',e=>{drag=true;wave.setPointerCapture(e.pointerId);last=Math.round(progress*(N-1));setX(e.clientX);});
  wave.addEventListener('pointermove',e=>{if(drag)setX(e.clientX);});
  wave.addEventListener('pointerup',()=>{drag=false;last=-1;});
  window.addEventListener('resize',()=>{render();renderMarkers();});
  setTimeout(()=>{render();renderMarkers();},20);
</script>
</body>
</html>
