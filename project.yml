name: SolaPlayer

options:
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: 0.1.0
    PRODUCT_BUNDLE_IDENTIFIER: com.solaplayer.app
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "5.0"

targets:
  SolaPlayer:
    type: application
    platform: iOS
    sources:
      - path: SolaPlayer
    info:
      path: SolaPlayer/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sola Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    postBuildScripts:
      - name: Embed build metadata
        script: '"$SRCROOT/scripts/embed-build-metadata.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_NAME: SolaPlayer

  SolaPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SolaPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.solaplayer.tests

schemes:
  SolaPlayer:
    build:
      targets:
        SolaPlayer: all
        SolaPlayerTests: [test]
    test:
      config: Debug
      targets:
        - SolaPlayerTests
    run:
      config: Debug
    archive:
      config: Release
