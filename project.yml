name: SolaPlayer

options:
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: 0.1.0
    PRODUCT_BUNDLE_IDENTIFIER: com.solaplayer.app
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "5.0"

targets:
  SolaPlayer:
    type: application
    platform: iOS
    sources:
      - path: SolaPlayer
    postBuildScripts:
      - name: Embed build metadata
        script: '"$SRCROOT/scripts/embed-build-metadata.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sola Player
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        PRODUCT_NAME: SolaPlayer

schemes:
  SolaPlayer:
    build:
      targets:
        SolaPlayer: all
    run:
      config: Debug
    archive:
      config: Release
